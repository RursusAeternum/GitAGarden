# Release pipeline: `git tag v0.1.0 && git push --tags` builds binaries for
# macOS, Linux and Raspberry Pi and publishes a GitHub release. The Homebrew
# tap (RursusAeternum/homebrew-tap) picks new releases up on its own, so no
# cross-repo token is needed here.
version: 2
project_name: gag

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - main: ./cmd/gag
    binary: gag
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64, arm]
    goarm: ["6", "7"] # 6: Pi Zero/1, 7: 32-bit Raspberry Pi OS
    ignore:
      - goos: darwin
        goarch: arm
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    # No version in the name, so .../releases/latest/download/<name> is a
    # stable URL for install.sh and the tap.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
